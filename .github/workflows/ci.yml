name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l ./cmd ./config ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: cross build (linux/amd64, linux/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-w -s" -o /tmp/fsb-$arch ./cmd/fsb
            ls -lh /tmp/fsb-$arch
          done
